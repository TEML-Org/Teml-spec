# yaml-language-server: $schema=../schema/teml-alpha-003.schema.json
#
# The "Simple Example" from teml.org as a compliant TEML document, extended
# with an automation and Given/When/Then specs.

apiVersion: teml.org/v-alpha-003
metadata:
  name: sample
  description: Adding users, keeping their details current, and welcoming them by email.

screens:
  - AddUserForm:
  - UserList:

types:
  - PendingEmail:
      id: g
      email: s

automations:
  - WelcomeEmailer:
      description: Sends a welcome email to each newly added user.
      schedule: every minute

aggs:
  - UserAgg:
      id: g
      firstName: s
      lastName: s
      age: int
      email: s

views:
  - UserView:
      id: g
      firstName: s
      lastName: s
      age: int

  - PendingWelcomeEmails:     # the automation's to-do list
      pending: PendingEmail[]

# Slices (left to right on the timeline)
slices:
  - AddUser:
      agg: UserAgg
      trigger: { screen: AddUserForm }
      command:
        AddUser:
          id: g
          firstName: s
          lastName: s
          age: int
          email: s
      events:
        - AddedUser:
            id: g
            firstName: s
            lastName: s
            age: int
            email: s
      views:
        - UserView
        - PendingWelcomeEmails: [pending]
      status: Completed
      specs:
        - name: adds a new user
          when:
            AddUser: { id: u-1, firstName: Ada, lastName: Lovelace, age: 36, email: ada@example.com }
          then:
            - AddedUser: { id: u-1, firstName: Ada, lastName: Lovelace, age: 36, email: ada@example.com }
        - name: rejects a duplicate id
          given:
            - AddedUser: { id: u-1 }
          when:
            AddUser: { id: u-1 }
          then:
            - error: UserAlreadyExists

  # No command given: it is inferred as "RenameUser" with unspecified props.
  - RenameUser:
      agg: UserAgg
      events:
        - RenamedUser:
            id: g
            firstName: s
            lastName: s
      views:
        - UserView: [id, firstName, lastName]
      status: Completed

  - ReAgeUser:
      story: "https://www.example.com/12345"
      status: InDev
      agg: UserAgg
      events:
        - ReAgedUser:
            id: g
            age: int
      views:
        - UserView: [id, age]

  - ShowUsers:
      view: UserView
      readBy:
        - screen: UserList
      status: Completed

  # View slice: the WelcomeEmailer works from this to-do list.
  - WelcomeTodo:
      view: PendingWelcomeEmails
      readBy:
        - automation: WelcomeEmailer
      status: InDev

  # Automation: the WelcomeEmailer issues this slice's command.
  - SendWelcomeEmail:
      agg: UserAgg
      trigger: { automation: WelcomeEmailer }
      command:
        SendWelcomeEmail:
          id: g
          email: s
      events:
        - SentWelcomeEmail:
            id: g
            sentAt: dt
      views:
        - PendingWelcomeEmails: [pending]
      status: InDev
      specs:
        - name: emails a newly added user
          given:
            - AddedUser: { id: u-1, email: ada@example.com }
          then:
            - SendWelcomeEmail: { id: u-1, email: ada@example.com }
        - name: does not email the same user twice
          given:
            - AddedUser: { id: u-1, email: ada@example.com }
            - SentWelcomeEmail: { id: u-1 }
          then: []
