# yaml-language-server: $schema=../../schema/teml-alpha-003.schema.json
#
# Feature demo: API endpoints and calls (spec §12.8).
# Each change slice names the endpoint that issues its command (api). Screens,
# automations and external systems list the endpoints they call (calls). A call
# to one of our slices' endpoints is drawn like a trigger, so BookShipment and
# RecordDelivery need no trigger: of their own. The carrier's own API is outside
# the model, so the Shipment Booker's call to it is listed but not drawn.

apiVersion: teml.org/v-alpha-003
metadata:
  name: Order shipping
  description: Orders are shipped by a carrier booked by an automation; the carrier reports deliveries back.

actors:
  - Shopper:

screens:
  - CheckoutPage:
      actor: Shopper
      calls:
        - POST /orders

systems:
  - Carrier:
      description: The delivery company. Reports each delivery to our webhook.
      calls:
        - POST /webhooks/deliveries

automations:
  - ShipmentBooker:
      description: Books a carrier pickup for each paid order, then records the shipment.
      schedule: every 5 minutes
      calls:
        - POST https://api.carrier.example/pickups   # the carrier's API, outside our model
        - POST /orders/{orderId}/shipment

aggs:
  - OrderAgg:
      orderId: g
      status: s

views:
  - OrdersToShip:
      orderIds: g[]

slices:
  - PlaceOrder:
      agg: OrderAgg
      trigger: { screen: CheckoutPage }
      api: POST /orders
      command:
        PlaceOrder: { orderId: g }
      events:
        - OrderPlaced: { orderId: g }
      views:
        - OrdersToShip: [orderIds]

  - ShippingTodo:
      view: OrdersToShip
      readBy:
        - automation: ShipmentBooker

  - BookShipment:
      agg: OrderAgg
      api: POST /orders/{id}/shipment          # matches the booker's call: {…} parameters are alike
      command:
        BookShipment: { orderId: g, trackingNumber: s }
      events:
        - ShipmentBooked: { orderId: g, trackingNumber: s }
      views:
        - OrdersToShip: [orderIds]

  - RecordDelivery:
      agg: OrderAgg
      api: POST /webhooks/deliveries
      command:
        RecordDelivery: { orderId: g, deliveredAt: dt }
      events:
        - OrderDelivered: { orderId: g, deliveredAt: dt }
