<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Front desk console: checking a guest in</title>
  <rect width="480" height="300" fill="#f7f7f7" stroke="#999"/>
  <rect width="480" height="36" fill="#555"/>
  <text x="14" y="23" fill="#fff" font-weight="bold">Harbour Hotel · Front desk</text>
  <text x="400" y="23" fill="#ddd">Ana Ruiz</text>
  <text x="16" y="62" font-size="15" font-weight="bold">Arrivals · 18 Oct</text>
  <rect x="16" y="76" width="448" height="30" fill="#fff" stroke="#ccc"/><text x="28" y="95">Grace Hopper</text><text x="230" y="95" fill="#666">Room 101 · 2 nights</text><rect x="376" y="82" width="76" height="18" rx="3" fill="#ddd"/><text x="390" y="95" font-size="11">Check in</text>
  <rect x="16" y="110" width="448" height="30" fill="#fff" stroke="#ccc"/><text x="28" y="129">Alan Turing</text><text x="230" y="129" fill="#666">Room 204 · 1 night</text><rect x="376" y="116" width="76" height="18" rx="3" fill="#ddd"/><text x="390" y="129" font-size="11">Check in</text>
  <rect x="0" y="36" width="480" height="264" fill="#000" fill-opacity="0.35"/>
  <rect x="110" y="70" width="260" height="190" rx="6" fill="#fff" stroke="#888"/>
  <text x="128" y="98" font-size="15" font-weight="bold">Check in Grace Hopper</text>
  <text x="128" y="124" fill="#666" font-size="11">Room</text><rect x="128" y="130" width="224" height="28" fill="#fff" stroke="#888"/><text x="138" y="149">101 ▾</text>
  <text x="128" y="178" fill="#666" font-size="11">ID checked</text><rect x="128" y="184" width="14" height="14" fill="#555"/><text x="150" y="196">Passport</text>
  <rect x="270" y="222" width="84" height="26" rx="3" fill="#555"/><text x="286" y="240" fill="#fff" font-weight="bold">Check in</text><text x="210" y="240" fill="#555">Cancel</text>
</svg>
