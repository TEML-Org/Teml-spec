# yaml-language-server: $schema=../../schema/teml-alpha-003.schema.json
#
# Feature demo: actors and screens (spec §10).
# Each actor gets a swimlane at the top of the board, and their screens sit in it.

apiVersion: teml.org/v-alpha-003
metadata:
  name: Coffee shop orders
  description: A customer orders at a kiosk; a barista makes the drink.

actors:
  - Customer:
      description: Orders drinks at the kiosk.
  - Barista:
      description: Makes the drinks.

screens:
  - OrderKiosk:
      actor: Customer
  - BaristaTablet:
      actor: Barista

aggs:
  - OrderAgg:
      orderId: g
      drink: s
      customerName: s
      status: s

slices:
  - PlaceOrder:
      agg: OrderAgg
      trigger: { screen: OrderKiosk }          # the Customer's screen
      command:
        PlaceOrder: { orderId: g, drink: s, customerName: s }
      events:
        - OrderPlaced: { orderId: g, drink: s, customerName: s }

  - StartOrder:
      agg: OrderAgg
      trigger: { screen: BaristaTablet }       # the Barista's screen
      command:
        StartOrder: { orderId: g }
      events:
        - OrderStarted: { orderId: g, startedAt: dt }

  - CompleteOrder:
      agg: OrderAgg
      trigger: { screen: BaristaTablet }       # same screen, another command
      command:
        CompleteOrder: { orderId: g }
      events:
        - OrderCompleted: { orderId: g, completedAt: dt }
