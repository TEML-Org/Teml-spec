# yaml-language-server: $schema=../../schema/teml-alpha-003.schema.json
#
# Feature demo: view slices (spec §12.6).
# A view slice shows where a read model is read: on screens, or by an
# automation that works from it as a to-do list.

apiVersion: teml.org/v-alpha-003
metadata:
  name: Coffee shop pickup
  description: Baristas work from a queue, customers track their order, and an automation texts customers when a drink is ready.

actors:
  - Customer:
  - Barista:

screens:
  - OrderKiosk:
      actor: Customer
  - OrderStatusPage:
      actor: Customer
  - BaristaTablet:
      actor: Barista

types:
  - QueuedOrder:
      orderId: g
      drink: s
      customerName: s
  - TextToSend:
      orderId: g
      phone: s

aggs:
  - OrderAgg:
      orderId: g
      drink: s
      phone: s
      status: s

views:
  - OrderQueue:
      orders: QueuedOrder[]

  - OrderStatus:
      orderId: g
      drink: s
      status: s

  - ReadyToNotify:
      pending: TextToSend[]

automations:
  - ReadyNotifier:
      description: Texts the customer when their drink is ready.

slices:
  - PlaceOrder:
      agg: OrderAgg
      trigger: { screen: OrderKiosk }
      command:
        props: { orderId: g, drink: s, customerName: s, phone: s }
      events:
        - OrderPlaced: { orderId: g, drink: s, customerName: s, phone: s }
      views:
        - OrderQueue: [orders]
        - OrderStatus: [orderId, drink, status]

  # View slice read by a screen: the barista's queue.
  - ShowQueue:
      view: OrderQueue
      readBy:
        - screen: BaristaTablet
      specs:
        - name: lists orders that are not finished yet
          given:
            - OrderPlaced: { orderId: o-1, drink: Latte, customerName: Ada }
            - OrderPlaced: { orderId: o-2, drink: Mocha, customerName: Grace }
            - OrderCompleted: { orderId: o-1 }
          then:
            - OrderQueue:
                orders:
                  - { orderId: o-2, drink: Mocha, customerName: Grace }

  - CompleteOrder:
      agg: OrderAgg
      trigger: { screen: BaristaTablet }
      command:
        props: { orderId: g }
      events:
        - OrderCompleted: { orderId: g, completedAt: dt }
      views:
        - OrderQueue: [orders]
        - OrderStatus: [status]
        - ReadyToNotify: [pending]

  # View slice read by two screens, used by two different actors.
  - TrackOrder:
      view: OrderStatus
      readBy:
        - screen: OrderStatusPage
        - screen: BaristaTablet
      specs:
        - name: shows the order as ready once it is completed
          given:
            - OrderPlaced: { orderId: o-1, drink: Latte }
            - OrderCompleted: { orderId: o-1 }
          then:
            - OrderStatus: { orderId: o-1, drink: Latte, status: Ready }

  # View slice read by an automation: its to-do list.
  - NotifyTodo:
      view: ReadyToNotify
      readBy:
        - automation: ReadyNotifier
      specs:
        - name: lists completed orders whose customer has not been texted
          given:
            - OrderPlaced: { orderId: o-1, phone: "+1 555 0100" }
            - OrderCompleted: { orderId: o-1 }
          then:
            - ReadyToNotify:
                pending:
                  - { orderId: o-1, phone: "+1 555 0100" }

  - NotifyCustomer:
      agg: OrderAgg
      trigger: { automation: ReadyNotifier }
      command:
        name: SendReadyText
        props: { orderId: g, phone: s }
      events:
        - CustomerNotified: { orderId: g, notifiedAt: dt }
      views:
        - ReadyToNotify: [pending]
