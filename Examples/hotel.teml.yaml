# yaml-language-server: $schema=../schema/teml-alpha-002.schema.json
#
# Hotel booking: the classic Event Modeling example (see eventmodeling.org)
# as a compliant TEML document. It uses every v-alpha-002 feature: actors and
# screens, change and view slices, automations, an external system, and specs.

apiVersion: teml.org/v-alpha-002
metadata:
  name: Hotel
  description: >
    Guests find and book rooms and pay online. The front desk checks guests in
    and out, and housekeeping cleans rooms between stays.
  version: "0.2.0"

types:
  - RoomType:
      enum: [Single, Double, Suite]
  - BookingStatus:
      enum: [AwaitingPayment, Confirmed, CheckedIn, CheckedOut, Cancelled]

# People (the swimlanes at the top of the board) and their screens.
# Actors are referenced by name, so their names don't need anchors.
actors:
  - Guest:
      description: Someone booking or staying at the hotel.
  - Manager:
      description: Runs the hotel and manages its rooms.
  - FrontDesk:
      description: Reception staff who check guests in and out.
  - Housekeeping:
      description: Staff who clean rooms between stays.

screens:
  - SignUpPage:
      actor: Guest
  - RoomSearch:
      actor: Guest
      wireframe: wireframes/room-search.png
  - MyBookings:
      actor: Guest
  - RoomManagement:
      actor: Manager
  - FrontDeskConsole:
      actor: FrontDesk
  - HousekeepingTablet:
      actor: Housekeeping

# Aggregates
aggs:
  - GuestAgg: &Guest
      guestId: g
      name: s
      email: s

  - RoomAgg: &Room
      roomNumber: s
      roomType: RoomType
      nightlyRate: dec
      needsCleaning: bool

  - BookingAgg: &Booking
      bookingId: g
      guestId: g
      roomNumber: s
      checkIn: date
      checkOut: date
      total: dec
      status: BookingStatus

# Views
views:
  - RoomAvailability: &RoomAvailability
      rooms:
        - roomNumber: s
          roomType: RoomType
          nightlyRate: dec
          bookedNights: date[]

  - GuestBookings: &GuestBookings
      guestId: g
      guestName: s
      bookings:
        - bookingId: g
          roomNumber: s
          checkIn: date
          checkOut: date
          total: dec
          status: BookingStatus

  - PaymentsToRequest: &PaymentsToRequest
      pending:
        - bookingId: g
          guestId: g
          total: dec

  - CleaningSchedule: &CleaningSchedule
      rooms:
        - roomNumber: s
          vacatedAt: dt

# Workflow engines (defined before `systems` so that systems can alias them)
wfes:
  - PaymentRequester: &PaymentRequester
      description: Asks the payment provider to charge the guest for each new booking.
      schedule: every minute

  - PaymentListener: &PaymentListener
      description: Receives payment callbacks (webhooks) from the payment provider.

# External systems and the events they send us
systems:
  - PaymentProvider:
      description: Third-party card payments.
      events:
        - name: PaymentSucceeded
          props:
            paymentId: s
            bookingId: g
            amount: dec
          wfes:
            - *PaymentListener

# Slices (left to right on the timeline)
slices:

  # ---- Setting up --------------------------------------------------------

  - RegisterGuest:
      agg: *Guest
      trigger: { screen: SignUpPage }
      command:
        props:
          guestId: g
          name: s
          email: s
      event:
        name: GuestRegistered
        props:
          guestId: g
          name: s
          email: s
      views:
        - <<: *GuestBookings
          guestId: x
          guestName: x
      status: Completed
      specs:
        - name: registers a guest
          when:
            RegisterGuest: { guestId: g-1, name: Ada Lovelace, email: ada@example.com }
          then:
            - GuestRegistered: { guestId: g-1, name: Ada Lovelace, email: ada@example.com }
        - name: rejects an email that is already registered
          given:
            - GuestRegistered: { guestId: g-1, email: ada@example.com }
          when:
            RegisterGuest: { guestId: g-2, email: ada@example.com }
          then:
            - error: EmailAlreadyRegistered

  - AddRoom:
      agg: *Room
      trigger: { screen: RoomManagement }
      command:
        props:
          roomNumber: s
          roomType: RoomType
          nightlyRate: dec
      event:
        name: RoomAdded
        props:
          roomNumber: s
          roomType: RoomType
          nightlyRate: dec
      views:
        - <<: *RoomAvailability
          rooms: x
      status: Completed

  # ---- Booking -------------------------------------------------------------

  # View slice: the guest browses availability before booking.
  - BrowseRooms:
      view: *RoomAvailability
      readBy:
        - screen: RoomSearch
      status: Completed
      specs:
        - name: shows a booked night as taken
          given:
            - RoomAdded: { roomNumber: "101", roomType: Double, nightlyRate: 120.00 }
            - RoomBooked: { bookingId: b-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-03 }
          then:
            - RoomAvailability:
                rooms:
                  - { roomNumber: "101", roomType: Double, nightlyRate: 120.00, bookedNights: [2026-11-02] }

  - BookRoom:
      agg: *Booking
      trigger: { screen: RoomSearch }
      command:
        props:
          bookingId: g
          guestId: g
          roomNumber: s
          checkIn: date
          checkOut: date
      event:
        name: RoomBooked
        props:
          bookingId: g
          guestId: g
          roomNumber: s
          checkIn: date
          checkOut: date
          total: dec
      views:
        - <<: *RoomAvailability
          rooms: x
        - <<: *GuestBookings
          bookings: x
        - <<: *PaymentsToRequest
          pending: x
      status: InDev
      story: HOTEL-12
      specs:
        - name: books an available room and prices the stay
          given:
            - RoomAdded: { roomNumber: "101", roomType: Double, nightlyRate: 120.00 }
          when:
            BookRoom: { bookingId: b-1, guestId: g-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-05 }
          then:
            - RoomBooked: { bookingId: b-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-05, total: 360.00 }
        - name: rejects dates that overlap an existing booking
          given:
            - RoomAdded: { roomNumber: "101" }
            - RoomBooked: { bookingId: b-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-05 }
          when:
            BookRoom: { bookingId: b-2, roomNumber: "101", checkIn: 2026-11-04, checkOut: 2026-11-06 }
          then:
            - error: RoomUnavailable

  # ---- Payment -------------------------------------------------------------

  # View slice: the PaymentRequester WFE works from this to-do list.
  - PaymentTodo:
      view: *PaymentsToRequest
      readBy:
        - wfe: *PaymentRequester
      status: InDev
      specs:
        - name: lists bookings that still need a payment request
          given:
            - RoomBooked: { bookingId: b-1, guestId: g-1, total: 360.00 }
            - RoomBooked: { bookingId: b-2, guestId: g-2, total: 120.00 }
            - PaymentRequested: { bookingId: b-1 }
          then:
            - PaymentsToRequest:
                pending:
                  - { bookingId: b-2, guestId: g-2, total: 120.00 }

  # Automation: the WFE issues a command for each item on its to-do list.
  - RequestPayment:
      agg: *Booking
      trigger: { wfe: *PaymentRequester }
      command:
        props:
          bookingId: g
          amount: dec
      event:
        name: PaymentRequested
        props:
          bookingId: g
          amount: dec
          requestedAt: dt
      views:
        - <<: *PaymentsToRequest
          pending: x
      status: InDev
      specs:
        - name: requests payment for a new booking
          given:
            - RoomBooked: { bookingId: b-1, total: 360.00 }
          then:
            - RequestPayment: { bookingId: b-1, amount: 360.00 }
        - name: does not request payment twice
          given:
            - RoomBooked: { bookingId: b-1, total: 360.00 }
            - PaymentRequested: { bookingId: b-1 }
          then: []

  # Translation: the provider's PaymentSucceeded event (see `systems`)
  # triggers PaymentListener, which records the payment.
  - RecordPayment:
      agg: *Booking
      trigger: { wfe: *PaymentListener }
      command:
        props:
          bookingId: g
          amount: dec
          providerReference: s
      events:
        - name: PaymentReceived
          props:
            bookingId: g
            amount: dec
            providerReference: s
        - name: BookingConfirmed
          props:
            bookingId: g
      views:
        - <<: *GuestBookings
          bookings: x
      status: Planned
      specs:
        - name: records a successful payment
          given:
            - PaymentSucceeded: { paymentId: pay_123, bookingId: b-1, amount: 360.00 }
          then:
            - RecordPayment: { bookingId: b-1, amount: 360.00, providerReference: pay_123 }

  # ---- Managing a booking --------------------------------------------------

  # View slice: one view, read on two screens by two different actors.
  - ShowBookings:
      view: *GuestBookings
      readBy:
        - screen: MyBookings
        - screen: FrontDeskConsole
      status: Planned
      specs:
        - name: shows a confirmed booking
          given:
            - GuestRegistered: { guestId: g-1, name: Ada Lovelace }
            - RoomBooked: { bookingId: b-1, guestId: g-1, roomNumber: "101", total: 360.00 }
            - BookingConfirmed: { bookingId: b-1 }
          then:
            - GuestBookings:
                guestId: g-1
                guestName: Ada Lovelace
                bookings:
                  - { bookingId: b-1, roomNumber: "101", total: 360.00, status: Confirmed }

  - CancelBooking:
      agg: *Booking
      trigger: { screen: MyBookings }
      command:
        props:
          bookingId: g
          reason: s?
      event:
        name: BookingCancelled
        props:
          bookingId: g
          reason: s?
      views:
        - <<: *RoomAvailability
          rooms: x
        - <<: *GuestBookings
          bookings: x
      status: Planned
      specs:
        - name: cannot cancel after check-in
          given:
            - RoomBooked: { bookingId: b-1 }
            - GuestCheckedIn: { bookingId: b-1 }
          when:
            CancelBooking: { bookingId: b-1 }
          then:
            - error: AlreadyCheckedIn

  # ---- The stay ----------------------------------------------------------

  - CheckIn:
      agg: *Booking
      trigger: { screen: FrontDeskConsole }
      command:
        props:
          bookingId: g
      event:
        name: GuestCheckedIn
        props:
          bookingId: g
          roomNumber: s
          checkedInAt: dt
      views:
        - <<: *GuestBookings
          bookings: x
      status: Planned
      specs:
        - name: cannot check in before payment is confirmed
          given:
            - RoomBooked: { bookingId: b-1 }
          when:
            CheckIn: { bookingId: b-1 }
          then:
            - error: PaymentNotConfirmed

  - CheckOut:
      agg: *Booking
      trigger: { screen: FrontDeskConsole }
      command:
        props:
          bookingId: g
      event:
        name: GuestCheckedOut
        props:
          bookingId: g
          roomNumber: s
          checkedOutAt: dt
      views:
        - <<: *GuestBookings
          bookings: x
        - <<: *CleaningSchedule
          rooms: x
      status: Planned

  # ---- Housekeeping --------------------------------------------------------

  - CleaningList:
      view: *CleaningSchedule
      readBy:
        - screen: HousekeepingTablet
      status: Planned

  - MarkRoomCleaned:
      agg: *Room
      trigger: { screen: HousekeepingTablet }
      command:
        props:
          roomNumber: s
      event:
        name: RoomCleaned
        props:
          roomNumber: s
          cleanedAt: dt
      views:
        - <<: *CleaningSchedule
          rooms: x
      status: Planned
