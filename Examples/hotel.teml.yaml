# yaml-language-server: $schema=../schema/teml-alpha-003.schema.json
#
# Hotel booking: the classic Event Modeling example (see eventmodeling.org)
# as a compliant TEML document. It uses every v-alpha-003 feature: actors and
# screens, change and view slices, automations, an external system that calls
# our API, and specs.

apiVersion: teml.org/v-alpha-003
metadata:
  name: Hotel
  description: >
    Guests find and book rooms and pay online. The front desk checks guests in
    and out, and housekeeping cleans rooms between stays.
  version: "0.3.0"

types:
  - RoomType:
      enum: [Single, Double, Suite]
  - BookingStatus:
      enum: [AwaitingPayment, Confirmed, CheckedIn, CheckedOut, Cancelled]

  # Rows of the list views below. A list of objects uses a named type.
  - AvailableRoom:
      roomNumber: s
      roomType: RoomType
      nightlyRate: dec
      bookedNights: date[]
  - BookingSummary:
      bookingId: g
      roomNumber: s
      checkIn: date
      checkOut: date
      total: dec
      status: BookingStatus
  - BookingToBill:
      bookingId: g
      guestId: g
      total: dec
  - BookingToConfirm:
      bookingId: g
      guestId: g
  - RoomToClean:
      roomNumber: s
      vacatedAt: dt

# People (the swimlanes at the top of the board) and their screens.
actors:
  - Guest:
      description: Someone booking or staying at the hotel.
  - Manager:
      description: Runs the hotel and manages its rooms.
  - FrontDesk:
      description: Reception staff who check guests in and out.
  - Housekeeping:
      description: Staff who clean rooms between stays.

screens:
  - SignUpPage:
      actor: Guest
  - RoomSearch:
      actor: Guest
      wireframe: wireframes/room-search.png
  - MyBookings:
      actor: Guest
  - RoomManagement:
      actor: Manager
  - FrontDeskConsole:
      actor: FrontDesk
  - HousekeepingTablet:
      actor: Housekeeping

# Aggregates
aggs:
  - GuestAgg:
      guestId: g
      name: s
      email: s

  - RoomAgg:
      roomNumber: s
      roomType: RoomType
      nightlyRate: dec
      needsCleaning: bool

  - BookingAgg:
      bookingId: g
      guestId: g
      roomNumber: s
      checkIn: date
      checkOut: date
      total: dec
      status: BookingStatus

# Views
views:
  - RoomAvailability:
      rooms: AvailableRoom[]

  - GuestBookings:
      guestId: g
      guestName: s
      bookings: BookingSummary[]

  - PaymentsToRequest:
      pending: BookingToBill[]

  - ConfirmationsToSend:
      pending: BookingToConfirm[]

  - CleaningSchedule:
      rooms: RoomToClean[]

# Automations
automations:
  - PaymentRequester:
      description: Asks the payment provider to charge the guest for each new booking.
      schedule: every minute

  - ConfirmationEmailer:
      description: Emails the guest as soon as their booking is confirmed.

# External systems that call our API
systems:
  - PaymentProvider:
      description: Third-party card payments. Calls POST /webhooks/payments when a charge succeeds.

# Slices (left to right on the timeline)
slices:

  # ---- Setting up --------------------------------------------------------

  - RegisterGuest:
      agg: GuestAgg
      trigger: { screen: SignUpPage }
      command:
        RegisterGuest:
          guestId: g
          name: s
          email: s
      events:
        - GuestRegistered:
            guestId: g
            name: s
            email: s
      views:
        - GuestBookings: [guestId, guestName]
      status: Completed
      specs:
        - name: registers a guest
          when:
            RegisterGuest: { guestId: g-1, name: Ada Lovelace, email: ada@example.com }
          then:
            - GuestRegistered: { guestId: g-1, name: Ada Lovelace, email: ada@example.com }
        - name: rejects an email that is already registered
          given:
            - GuestRegistered: { guestId: g-1, email: ada@example.com }
          when:
            RegisterGuest: { guestId: g-2, email: ada@example.com }
          then:
            - error: EmailAlreadyRegistered

  - AddRoom:
      agg: RoomAgg
      trigger: { screen: RoomManagement }
      command:
        AddRoom:
          roomNumber: s
          roomType: RoomType
          nightlyRate: dec
      events:
        - RoomAdded:
            roomNumber: s
            roomType: RoomType
            nightlyRate: dec
      views:
        - RoomAvailability: [rooms]
      status: Completed

  # ---- Booking -------------------------------------------------------------

  # View slice: the guest browses availability before booking.
  - BrowseRooms:
      view: RoomAvailability
      readBy:
        - screen: RoomSearch
      status: Completed
      specs:
        - name: shows a booked night as taken
          given:
            - RoomAdded: { roomNumber: "101", roomType: Double, nightlyRate: 120.00 }
            - RoomBooked: { bookingId: b-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-03 }
          then:
            - RoomAvailability:
                rooms:
                  - { roomNumber: "101", roomType: Double, nightlyRate: 120.00, bookedNights: [2026-11-02] }

  - BookRoom:
      agg: BookingAgg
      trigger: { screen: RoomSearch }
      command:
        BookRoom:
          bookingId: g
          guestId: g
          roomNumber: s
          checkIn: date
          checkOut: date
      events:
        - RoomBooked:
            bookingId: g
            guestId: g
            roomNumber: s
            checkIn: date
            checkOut: date
            total: dec
      views:
        - RoomAvailability: [rooms]
        - GuestBookings: [bookings]
        - PaymentsToRequest: [pending]
      status: InDev
      story: HOTEL-12
      specs:
        - name: books an available room and prices the stay
          given:
            - RoomAdded: { roomNumber: "101", roomType: Double, nightlyRate: 120.00 }
          when:
            BookRoom: { bookingId: b-1, guestId: g-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-05 }
          then:
            - RoomBooked: { bookingId: b-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-05, total: 360.00 }
        - name: rejects dates that overlap an existing booking
          given:
            - RoomAdded: { roomNumber: "101" }
            - RoomBooked: { bookingId: b-1, roomNumber: "101", checkIn: 2026-11-02, checkOut: 2026-11-05 }
          when:
            BookRoom: { bookingId: b-2, roomNumber: "101", checkIn: 2026-11-04, checkOut: 2026-11-06 }
          then:
            - error: RoomUnavailable

  # ---- Payment -------------------------------------------------------------

  # View slice: the Payment Requester works from this to-do list.
  - PaymentTodo:
      view: PaymentsToRequest
      readBy:
        - automation: PaymentRequester
      status: InDev
      specs:
        - name: lists bookings that still need a payment request
          given:
            - RoomBooked: { bookingId: b-1, guestId: g-1, total: 360.00 }
            - RoomBooked: { bookingId: b-2, guestId: g-2, total: 120.00 }
            - PaymentRequested: { bookingId: b-1 }
          then:
            - PaymentsToRequest:
                pending:
                  - { bookingId: b-2, guestId: g-2, total: 120.00 }

  # Automation: the requester issues a command for each item on its to-do list.
  - RequestPayment:
      agg: BookingAgg
      trigger: { automation: PaymentRequester }
      command:
        RequestPayment:
          bookingId: g
          amount: dec
      events:
        - PaymentRequested:
            bookingId: g
            amount: dec
            requestedAt: dt
      views:
        - PaymentsToRequest: [pending]
      status: InDev
      specs:
        - name: requests payment for a new booking
          given:
            - RoomBooked: { bookingId: b-1, total: 360.00 }
          then:
            - RequestPayment: { bookingId: b-1, amount: 360.00 }
        - name: does not request payment twice
          given:
            - RoomBooked: { bookingId: b-1, total: 360.00 }
            - PaymentRequested: { bookingId: b-1 }
          then: []

  # Translation: the payment provider's webhook calls our API, which issues
  # RecordPayment. The events are ours, and BookingConfirmed puts the booking
  # on the Confirmation Emailer's to-do list.
  - RecordPayment:
      agg: BookingAgg
      trigger: { system: PaymentProvider }
      command:
        RecordPayment:
          bookingId: g
          amount: dec
          providerReference: s
      events:
        - PaymentReceived:
            bookingId: g
            amount: dec
            providerReference: s
        - BookingConfirmed:
            bookingId: g
      views:
        - GuestBookings: [bookings]
        - ConfirmationsToSend: [pending]
      status: Planned
      specs:
        - name: records the payment and confirms the booking
          given:
            - RoomBooked: { bookingId: b-1, total: 360.00 }
            - PaymentRequested: { bookingId: b-1, amount: 360.00 }
          when:
            RecordPayment: { bookingId: b-1, amount: 360.00, providerReference: pay_123 }
          then:
            - PaymentReceived: { bookingId: b-1, amount: 360.00, providerReference: pay_123 }
            - BookingConfirmed: { bookingId: b-1 }
        - name: rejects a payment for an unknown booking
          when:
            RecordPayment: { bookingId: b-9, amount: 50.00, providerReference: pay_999 }
          then:
            - error: UnknownBooking

  # View slice: the Confirmation Emailer works from this to-do list.
  - ConfirmationTodo:
      view: ConfirmationsToSend
      readBy:
        - automation: ConfirmationEmailer
      status: Planned
      specs:
        - name: lists confirmed bookings that have not been emailed
          given:
            - RoomBooked: { bookingId: b-1, guestId: g-1 }
            - BookingConfirmed: { bookingId: b-1 }
          then:
            - ConfirmationsToSend:
                pending:
                  - { bookingId: b-1, guestId: g-1 }

  # Automation: the emailer issues a command for each item on its to-do list.
  - SendBookingConfirmation:
      agg: BookingAgg
      trigger: { automation: ConfirmationEmailer }
      command:
        SendConfirmationEmail:
          bookingId: g
      events:
        - ConfirmationEmailSent:
            bookingId: g
            sentAt: dt
      views:
        - ConfirmationsToSend: [pending]
      status: Planned
      specs:
        - name: emails the guest once the booking is confirmed
          given:
            - BookingConfirmed: { bookingId: b-1 }
          then:
            - SendConfirmationEmail: { bookingId: b-1 }

  # ---- Managing a booking --------------------------------------------------

  # View slice: one view, read on two screens by two different actors.
  - ShowBookings:
      view: GuestBookings
      readBy:
        - screen: MyBookings
        - screen: FrontDeskConsole
      status: Planned
      specs:
        - name: shows a confirmed booking
          given:
            - GuestRegistered: { guestId: g-1, name: Ada Lovelace }
            - RoomBooked: { bookingId: b-1, guestId: g-1, roomNumber: "101", total: 360.00 }
            - BookingConfirmed: { bookingId: b-1 }
          then:
            - GuestBookings:
                guestId: g-1
                guestName: Ada Lovelace
                bookings:
                  - { bookingId: b-1, roomNumber: "101", total: 360.00, status: Confirmed }

  - CancelBooking:
      agg: BookingAgg
      trigger: { screen: MyBookings }
      command:
        CancelBooking:
          bookingId: g
          reason: s?
      events:
        - BookingCancelled:
            bookingId: g
            reason: s?
      views:
        - RoomAvailability: [rooms]
        - GuestBookings: [bookings]
      status: Planned
      specs:
        - name: cannot cancel after check-in
          given:
            - RoomBooked: { bookingId: b-1 }
            - GuestCheckedIn: { bookingId: b-1 }
          when:
            CancelBooking: { bookingId: b-1 }
          then:
            - error: AlreadyCheckedIn

  # ---- The stay ----------------------------------------------------------

  - CheckIn:
      agg: BookingAgg
      trigger: { screen: FrontDeskConsole }
      command:
        CheckIn:
          bookingId: g
      events:
        - GuestCheckedIn:
            bookingId: g
            roomNumber: s
            checkedInAt: dt
      views:
        - GuestBookings: [bookings]
      status: Planned
      specs:
        - name: cannot check in before payment is confirmed
          given:
            - RoomBooked: { bookingId: b-1 }
          when:
            CheckIn: { bookingId: b-1 }
          then:
            - error: PaymentNotConfirmed

  - CheckOut:
      agg: BookingAgg
      trigger: { screen: FrontDeskConsole }
      command:
        CheckOut:
          bookingId: g
      events:
        - GuestCheckedOut:
            bookingId: g
            roomNumber: s
            checkedOutAt: dt
      views:
        - GuestBookings: [bookings]
        - CleaningSchedule: [rooms]
      status: Planned

  # ---- Housekeeping --------------------------------------------------------

  - CleaningList:
      view: CleaningSchedule
      readBy:
        - screen: HousekeepingTablet
      status: Planned

  - MarkRoomCleaned:
      agg: RoomAgg
      trigger: { screen: HousekeepingTablet }
      command:
        MarkRoomCleaned:
          roomNumber: s
      events:
        - RoomCleaned:
            roomNumber: s
            cleanedAt: dt
      views:
        - CleaningSchedule: [rooms]
      status: Planned
