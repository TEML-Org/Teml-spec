# A TEML sketch: no header and no types. It records just enough for the team
# to talk about the model. This is the "skimmed down" style from teml.org,
# written so that it is valid YAML.

aggs:
  - UserAgg: [id, firstName, lastName, age]

views:
  - UserView: [id, firstName, lastName, age]

slices:
  # The command is left out; it is inferred as "AddUser" from the slice name.
  - AddUser:
      events:
        - AddedUser: [id, firstName, lastName, age]
      views: [UserView]

  - RenameUser:
      events:
        - RenamedUser: [id, firstName, lastName]
      views:
        - UserView: [firstName, lastName]

  - ReAgeUser:
      events: [ReAgedUser]
      views:
        - UserView: [age]
