<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
__CSS__
  .board-app { display: grid; gap: 20px; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="facts" id="facts"></div>
  </header>
  <div class="board-app">
__TOOLBAR__
  </div>
  <details class="src">
    <summary id="srcSummary">TEML source</summary>
    <pre id="src"></pre>
  </details>
</div>

<script>
__JS__
const M = __DATA__;
document.getElementById("eyebrow").textContent = `${M.file} · ${M.apiVersion}`;
document.getElementById("title").textContent = `${M.metadata.name} event model`;
document.getElementById("lede").textContent = M.metadata.description ?? "";
document.getElementById("facts").innerHTML = TEML_BOARD.facts(M);
document.getElementById("src").textContent = M.source;
document.getElementById("srcSummary").textContent = `TEML source (${M.file})`;
TEML_BOARD.mountBoard(document.querySelector(".board-app"), M, { select: "__SELECT__" });
</script>
