# Validates the compliant examples against the schema, so a broken one can't be merged.
# Then runs the semantic checks (spec §14) and the tools' tests from the private
# mtalcott-perp-comp/teml-tools against this commit, using the TEML_TOOLS_TOKEN secret.
name: Check examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock ajv-cli@5.0.0 ajv-formats@3.0.1
      - name: Validate examples against the schema
        run: >-
          npx ajv validate --spec=draft2020 -c ajv-formats --all-errors
          --strict=true --strict-types=false --strict-required=false --allow-matching-properties
          -s schema/teml-alpha-003.schema.json
          -d Examples/user-compliant.teml.yaml -d Examples/hotel.teml.yaml -d "Examples/features/*.yaml"

  # teml-tools is private, so it is read with a fine-grained token (Contents: read, that repo only).
  # Without the secret (as on PRs from forks) the job is skipped with a notice.
  semantic:
    runs-on: ubuntu-24.04
    env:
      TEML_TOOLS_TOKEN: ${{ secrets.TEML_TOOLS_TOKEN }}
    steps:
      - name: Skip without the TEML_TOOLS_TOKEN secret
        if: env.TEML_TOOLS_TOKEN == ''
        run: echo "::notice::TEML_TOOLS_TOKEN is not available, so the semantic checks were skipped."
      - uses: actions/checkout@v7
        if: env.TEML_TOOLS_TOKEN != ''
        with:
          repository: mtalcott-perp-comp/teml-tools
          token: ${{ env.TEML_TOOLS_TOKEN }}
          path: tools
      - uses: actions/checkout@v7
        if: env.TEML_TOOLS_TOKEN != ''
        with:
          path: tools/spec
      - uses: actions/setup-node@v7
        if: env.TEML_TOOLS_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - if: env.TEML_TOOLS_TOKEN != ''
        working-directory: tools
        run: |
          npm ci
          npm run check
          npm test
